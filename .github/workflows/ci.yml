name: CI

on:
  workflow_call:
    inputs:
      revision:
        description: 待检查的提交。留空时使用触发事件的默认提交。
        required: false
        type: string
        default: ""
      upload-artifacts:
        description: 保存本次检查生成的发布包。
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  checks:
    # Ubuntu 24.04 默认限制非特权 UID 映射；固定环境，不在 CI 关闭安全策略。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Check public source boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n .githooks/pre-push
          blocked="$(git ls-files -- benchmarks .cade .cade-mini \
            e2e-results benchmark-results eval-results evals)"
          if [[ -n "$blocked" ]]; then
            printf 'Internal assets must stay outside the public tree:\n%s\n' "$blocked" >&2
            exit 1
          fi
      - name: Install and probe Linux sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc \
            --die-with-parent -- /bin/true
      - name: Install check dependencies
        run: uv sync --locked --extra dev --extra docs
      - name: Docs check
        run: uv run --locked python -m cade_mini.docs check
      - name: Ruff lint check
        run: uv run --locked ruff check src/cade_mini/ tests/
      - name: Ruff format check
        run: uv run --locked ruff format --check src/cade_mini/ tests/
      - name: Pyright type check
        run: uv run --locked pyright src/cade_mini/
      - name: Regression tests
        run: |
          mkdir -p e2e-results/ci
          uv run --locked pytest -q tests --basetemp=e2e-results/ci/pytest
      - name: Headless TUI acceptance
        run: |
          uv run --locked pytest -q tests/test_mini_tui_e2e.py -m e2e \
            --basetemp=e2e-results/ci/tui --junitxml=e2e-results/ci/tui.xml
      - name: CLI startup check
        run: uv run --locked cade-mini --help
      - name: Module startup check
        run: uv run --locked python -m cade_mini --help
      - name: Login startup check
        run: uv run --locked cade-mini login --help
      - name: Build distributions
        run: uv build --no-sources
      - name: Check installed wheel without Cade
        shell: bash
        run: |
          uv venv --python 3.12 e2e-results/wheel-env
          uv export --locked --no-dev --no-emit-project --no-hashes \
            -o e2e-results/runtime-requirements.txt > /dev/null
          uv pip install --python e2e-results/wheel-env/bin/python \
            -r e2e-results/runtime-requirements.txt dist/*.whl
          mkdir -p e2e-results/wheel-workspace
          cd e2e-results/wheel-workspace
          ../wheel-env/bin/cade-mini --help
          ../wheel-env/bin/python -I -m cade_mini --help
          ../wheel-env/bin/cade-mini login --help
          ../wheel-env/bin/python -I -c \
            'import importlib.util; assert importlib.util.find_spec("cade") is None'
      - name: Calculate distribution checksums
        if: inputs.upload-artifacts
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload distributions
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos-sandbox:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Install check dependencies
        run: uv sync --locked --extra dev
      - name: Check native Seatbelt execution and CLI integration
        run: |
          mkdir -p e2e-results/ci
          uv run --locked pytest -q tests/test_mini_sandbox.py tests/test_mini_cli.py \
            tests/test_mini_policy.py tests/test_mini_review.py \
            --basetemp=e2e-results/ci/pytest
