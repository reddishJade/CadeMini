[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cade"
version = "0.1.2"
description = "A standalone, log-first coding agent."
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "filelock>=4.2.4",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "openai>=3.35.1",
    "orjson>=3.13.0",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "referencing>=0.37.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
docs = [
    "markdown-it-py>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Test", "*Tests"]
asyncio_mode = "auto"
addopts = "-m 'not mcp_external and not e2e'"
markers = [
    "mcp_external: requires npx and network access to run a pinned official MCP server",
    "e2e: runs a real Cade workflow and writes a trace under e2e-results/",
]

[project.scripts]
cade = "cade.hosts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cade", "cade.*"]

[tool.ruff.lint]
extend-select = ["B", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
