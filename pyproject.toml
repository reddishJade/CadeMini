[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cade-mini"
version = "0.3.0"
description = "A standalone, log-first coding agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "filelock>=3.0.0",
    "orjson>=3.11.9",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
docs = [
    "markdown-it-py>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Test", "*Tests"]
asyncio_mode = "auto"
addopts = "-m 'not mcp_external and not e2e'"
markers = [
    "mcp_external: requires npx and network access to run a pinned official MCP server",
    "e2e: runs a real Cade workflow and writes a trace under e2e-results/",
]

[project.scripts]
cade-mini = "cade_mini.hosts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cade_mini", "cade_mini.*"]

[tool.ruff.lint]
extend-select = ["B", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
